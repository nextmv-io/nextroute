name: python test
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  GO_VERSION: 1.26

jobs:
  python-test:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        platform:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            windows-latest,
            macos-latest,
            macos-15-intel,
          ]
    steps:
      - name: git clone
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.9.29"
          python-version: ${{ matrix.python-version }}

      # Go must be set up before installing the project, because `setup.py`
      # compiles the Nextroute binary with `go build`.
      - name: set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: install the project
        run: uv sync --locked --dev

      - name: unit tests
        run: uv run pytest
        working-directory: src

      # There appears to be a bug around
      # `nextmv-io/sdk@v1.8.0/golden/file.go:75` specifically in Windows. When
      # attempting to remove a temp file, the following error is encountered:
      # `panic: remove C:\Users\RUNNER~1\AppData\Local\Temp\output1368198263:
      # The process cannot access the file because it is being used by another
      # process.` We need to figure out why it only happens in Windows. Until
      # then, we will not run the golden file tests in Windows.
      # Source:https://github.com/nextmv-io/nextroute/actions/runs/11414952328/job/31764458969?pr=65
      - name: golden file tests from Python package
        if: ${{ matrix.platform != 'windows-latest' }}
        run: go test $(go list ./... | grep github.com/nextmv-io/nextroute/src)
