name: release
run-name: Release by @${{ github.actor }} from ${{ github.ref_name }}

on: [push]

permissions:
  contents: read

env:
  GO_VERSION: 1.26
  PYTHON_VERSION: 3.12

jobs:
  # Determine whether a release is needed and, if so, create the tag and the
  # GitHub release. The version is read from the VERSION file, which is bumped
  # by a developer in a regular pull request.
  release:
    if: ${{ github.ref_type == 'branch' }}
    uses: nextmv-io/release/.github/workflows/release.yml@949cbb3b90ab294f8da42cf9c314637deaa578f5 # develop
    permissions:
      contents: write
      pull-requests: write
    with:
      BRANCH: ${{ github.ref_name }}
      REPOSITORY: nextroute
      LANGUAGE: go
      PACKAGE_NAME: nextroute
      PACKAGE_LOCATION: "" # VERSION file lives at the repository root.
      VERSION_FILE: VERSION
    secrets:
      SLACK_URL_MISSION_CONTROL: ${{ secrets.SLACK_URL_MISSION_CONTROL }}
      NEXTMVBOT_SSH_KEY: ${{ secrets.NEXTMVBOT_SSH_KEY }}
      NEXTMVBOT_SIGNING_KEY: ${{ secrets.NEXTMVBOT_SIGNING_KEY }}

  build-sdist:
    name: wheels-sdist
    needs: release
    if: ${{ needs.release.outputs.RELEASE_NEEDED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Build sdist
        run: pipx run build --sdist

      - name: Check metadata
        run: pipx run twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-artifacts-sdist
          path: dist/*.tar.gz

  build-wheels:
    name: wheels-${{ matrix.platform }}
    needs: release
    if: ${{ needs.release.outputs.RELEASE_NEEDED == 'true' }}
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu-24.04
            platform: linux-amd64
          - image: ubuntu-24.04-arm
            platform: linux-arm64
          - image: macos-15-intel
            platform: macos-amd64
          - image: macos-14
            platform: macos-arm64
          - image: windows-latest
            platform: windows

    steps:
      - name: git clone ${{ github.ref_name }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: set up go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build wheels
        if: matrix.platform != 'macos-arm64'
        uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
        env:
          MACOSX_DEPLOYMENT_TARGET: 13.0

      - name: Build wheels
        if: matrix.platform == 'macos-arm64'
        uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
        env:
          # TODO: default wheel repair does not recognize the arm64 wheel.
          # This seems like a bug in delocate-wheel, which is the tool used by cibuildwheel,
          # since the binary works fine when installed. However, we skip a more thorough
          # investigation for now and just disable the repair step.
          CIBW_REPAIR_WHEEL_COMMAND: ""
          MACOSX_DEPLOYMENT_TARGET: 14.0

      - name: Verify clean directory
        run: git diff --exit-code
        shell: bash

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-artifacts-${{ matrix.platform }}
          path: wheelhouse/*.whl

  publish:
    runs-on: ubuntu-latest
    needs: [release, build-wheels, build-sdist]
    if: ${{ needs.release.outputs.RELEASE_NEEDED == 'true' }}
    environment:
      name: pypi
      url: https://pypi.org/p/nextroute
    permissions:
      contents: read
      id-token: write # This is required for trusted publishing to PyPI
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: dist

      - name: Print directory tree for reference
        uses: jaywcjlove/github-action-folder-tree@e0a53e98a23389b0019777ed2eb9e66e88817b2b # v1.3.0
        with:
          path: ./

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: ./dist

  notify:
    needs: [release, publish]
    if: ${{ needs.release.outputs.RELEASE_NEEDED == 'true' && needs.release.outputs.SHOULD_NOTIFY_SLACK == 'true' }}
    uses: nextmv-io/release/.github/workflows/notify-slack.yml@949cbb3b90ab294f8da42cf9c314637deaa578f5 # develop
    with:
      PACKAGE_NAME: nextroute
      VERSION: ${{ needs.release.outputs.VERSION }}
      REPOSITORY: nextroute
    secrets:
      SLACK_URL_MISSION_CONTROL: ${{ secrets.SLACK_URL_MISSION_CONTROL }}
