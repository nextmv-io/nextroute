[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel", "cibuildwheel", "hatch", "ruff"]

[project]
authors = [
    { email = "tech@nextmv.io", name = "Nextmv" }
]
classifiers = [
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.5.2",
]
description = "Nextroute is an engine for solving Vehicle Routing Problems (VRPs)."
dynamic = [
    "version",
]
keywords = [
    "decision engineering",
    "decision science",
    "decisions",
    "nextmv",
    "optimization",
    "operations research",
    "solver",
    "vehicle routing problem",
]
license = { file = "LICENSE" }
maintainers = [
    { email = "tech@nextmv.io", name = "Nextmv" }
]
name = "nextroute"
readme = "README.md"
# Intentionally no upper bound. The wheels are tagged py3-none-<platform> (see
# get_tag in setup.py), so a newly released interpreter still finds a matching
# wheel and keeps working without a new release from us. The package is pure
# Python plus a bundled Go binary invoked as a subprocess: it has no C extension
# and imports nothing beyond pydantic and long-stable stdlib modules, so there is
# nothing here that tracks the interpreter version. The classifiers below list
# the versions we actually exercise in CI; newer ones are expected to work and
# are not blocked. Only add an upper bound if a specific Python release is known
# to break us - in that case cap it at that version and say which one here.
requires-python = ">=3.10"

[project.urls]
Homepage = "https://www.nextmv.io"
Documentation = "https://docs.nextmv.io/nextroute"
Repository = "https://github.com/nextmv-io/nextroute"

[tool.ruff]
target-version = "py310"
lint.select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
]
line-length = 120
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.hatch.version]
path = "src/nextroute/__about__.py"

[tool.setuptools.packages.find]
where = ["src/"]
exclude = ["tests"]

[tool.setuptools.package-data]
nextroute = ["bin/*.exe"]

[tool.cibuildwheel]
test-command = 'python -c "exec(\"import nextroute\nprint(nextroute.nextroute_version())\")"'
# The wheels are tagged py3-none-<platform> (see get_tag in setup.py), so one
# build per platform covers every supported Python. Building more than one
# interpreter per platform would just produce the same wheel repeatedly. We build
# on the oldest supported Python so the emitted wheel cannot accidentally depend
# on a newer interpreter.
build = "cp310-*"
skip = "*musllinux*"
archs = "native"
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_28_aarch64"

[tool.cibuildwheel.linux]
before-all = """
dnf update -y
dnf -y install go
"""

[dependency-groups]
benchmark = [
    "nextmv==1.10.3",
]
dev = [
    "nextmv==1.10.3",
    "pytest==9.0.3",
    "ruff==0.16.3",
]
