[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel", "cibuildwheel", "hatch", "ruff"]

[project]
authors = [
    { email = "tech@nextmv.io", name = "Nextmv" }
]
classifiers = [
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.5.2",
]
description = "Nextroute is an engine for solving Vehicle Routing Problems (VRPs)."
dynamic = [
    "version",
]
keywords = [
    "decision engineering",
    "decision science",
    "decisions",
    "nextmv",
    "optimization",
    "operations research",
    "solver",
    "vehicle routing problem",
]
license = { file = "LICENSE" }
maintainers = [
    { email = "tech@nextmv.io", name = "Nextmv" }
]
name = "nextroute"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://www.nextmv.io"
Documentation = "https://docs.nextmv.io/nextroute"
Repository = "https://github.com/nextmv-io/nextroute"

[tool.ruff]
target-version = "py310"
lint.select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
]
line-length = 120
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.hatch.version]
path = "src/nextroute/__about__.py"

[tool.setuptools.packages.find]
where = ["src/"]
exclude = ["tests"]

[tool.setuptools.package-data]
nextroute = ["bin/*.exe"]

[tool.cibuildwheel]
test-command = 'python -c "exec(\"import nextroute\nprint(nextroute.nextroute_version())\")"'
build = "cp3{10,11,12,13}-*"
skip = "*musllinux*"
archs = "native"
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_28_aarch64"

[tool.cibuildwheel.linux]
before-all = """
dnf update -y
dnf -y install go
"""

[dependency-groups]
benchmark = [
    "nextmv==1.10.3",
]
dev = [
    "nextmv==1.10.3",
    "pytest==9.0.2",
    "ruff==0.16.3",
]
